name: Batch update

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Aucune permission par défaut : chaque job déclare la sienne.
permissions: {}

# Actions tierces épinglées par sha complet (tag en commentaire) ; les outils du
# batch (tsx, @anthropic-ai/sdk) ont une version exacte dans package.json et le
# lockfile racine, installés par npm ci.
jobs:
  # Lit les sources et appelle l'API : clés disponibles, jeton en lecture seule.
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install batch deps
        run: npm ci --ignore-scripts

      - name: Run batch update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npx --no-install tsx scripts/batch-update.ts

      # Exporte TOUT ce qui a changé dans le dépôt (pas seulement feeds/) : un fichier
      # écrit ailleurs n'est pas perdu en silence, le job commit le refuse et le journalise.
      - name: Export changes
        env:
          PATCH: ${{ runner.temp }}/batch.patch
        run: |
          git add --all
          git diff --cached --binary > "$PATCH"
          wc -c "$PATCH"

      - name: Upload changes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: batch-patch
          path: ${{ runner.temp }}/batch.patch
          retention-days: 7

  # Pousse le résultat : écriture sur le dépôt, sans clé ni installation npm.
  commit:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download changes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: batch-patch
          path: ${{ runner.temp }}/batch

      - name: Commit changes
        env:
          PATCH: ${{ runner.temp }}/batch/batch.patch
        run: |
          if [[ ! -s "$PATCH" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          # Refuse le patch entier (échec du job, motifs journalisés) s'il touche autre
          # chose que frontend/src/data/feeds/*.json en fichiers texte ordinaires.
          bash .github/scripts/controle-patch.sh "$PATCH"
          git apply "$PATCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/feeds/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(batch): weekly content refresh

          Co-Authored-By: Claude Sonnet 4.7 <noreply@anthropic.com>"
          git push
