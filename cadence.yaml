# Livraison par `cadence deliver` (https://github.com/Sylad/cadence).
# Cloudflare Pages (intégration Git) construit et publie lui-même à chaque push sur main :
# rien à lancer pour déployer. Pas de CI GitHub par commit (le seul workflow,
# batch-update, est planifié le lundi). La livraison se prouve par la page d'accueil
# qui porte le sha court du commit poussé (<meta name="version">, posé au build
# depuis CF_PAGES_COMMIT_SHA — frontend/src/lib/build-version.ts).
deliver:
  ci: none
  deploy: []
  verify:
    - url: https://claude-code-codex-25m.pages.dev/
      contains: '<meta name="version" content="${SHORT}">'
  verifyTimeout: 600

# Revue UX automatique des vagues (cadence orchestrate) : le programme lance l'app depuis la racine,
# sonde l'URL puis tue le groupe. Node 22 (.nvmrc) : le Node par défaut de la machine est trop ancien pour Astro 7 (Node ≥ 22.23.4).
orchestrate:
  # Escalade (L43, cadence L337 / 1.12.0) : avant de rendre un lot encore non conforme après ses passes, la vague joue
  # une correction et une revue neuve en Fable (règle du lead depuis le 17-10, oubliée deux fois à la main).
  escalation: { model: fable }
  # Porte de tests de la vague (L41) : lancée par le programme après chaque étape d'écriture, depuis la racine.
  # Commandes vérifiées vertes sur main le 2026-10-25 (npm test : 124 tests node --test, 123 passés, 1 ignoré ;
  # astro build : 36 pages). Les tests e2e lisent `dist` (ignoré par git).
  # L42 (25-10) : cadence joue maintenant `build` AVANT `test`, ligne de base comprise (cadence L333) — le build
  # n'est plus répété ici ; les tests qui lisent frontend/dist le trouvent construit par la porte `build`.
  # Les trois commandes passent par scripts/avec-node.sh : Node de .nvmrc, pas le premier du PATH hérité (porte rouge du 17-11, L70).
  test: 'cd frontend && ../scripts/avec-node.sh npm test'
  build: 'cd frontend && ../scripts/avec-node.sh npx astro build'
  # La page Plan de travail lit .cadence/raf.yaml au build (titres publics) : verify --gate rejoue sous des commits de plan seuls (cadence L450). Oubli constaté le 31-10 : deux builds Cloudflare rouges (L50, L58) derrière une porte « verte » héritée.
  gate: { readsPlan: true }
  precheck: true
  ux:
    command: 'cd frontend && ../scripts/avec-node.sh npx astro dev --port 4311 --host 127.0.0.1'
    url: http://127.0.0.1:4311
    timeout: 300

# Documentation qui suit le code (cadence docs.sync, L307 de cadence, 24-10) : raf check et la revue signalent un lot dont le code laisse sa doc en retard ; docs.articles = étude de cas du projet dans claude-code-codex (le bibliothécaire propose un lot là-bas).
docs:
  sync:
    # Structure du site (composants, layouts, lib, pages de premier niveau, config Astro) : le tableau « Pages » et la « Stack » du README, le CLAUDE.md. Exclus : les études de cas et les données (`data/`), ce sont des contenus, pas la structure.
    - paths: ['frontend/src/components/**', 'frontend/src/layouts/**', 'frontend/src/lib/**', 'frontend/src/pages/*.astro', 'frontend/astro.config.mjs', '!**/*.test.*', '!**/*.spec.*', '!**/__snapshots__/**']
      docs: [README.md, CLAUDE.md, 'docs/nouveautes/*.md']
    # Batch hebdomadaire et workflow : section « Mise à jour hebdo » du README et règles du CLAUDE.md.
    - paths: ['scripts/**', '.github/workflows/**', '!**/*.test.*']
      docs: [README.md, CLAUDE.md]
  since: 2026-10-24

# Analyse statique (L94, D-31 du registre parent ; cadence analyse, L801 de cadence ≥ 2.0.18) : la porte de `cadence run`
# la joue après le build et avant les tests ; l'existant est figé dans .cadence/analyse/<name>.json (cadence analyse --init),
# seules les violations nouvelles échouent. Seuils de cadence dans frontend/eslint.config.mjs (max-lines 400,
# max-lines-per-function 80, max-depth 4, max-params 5, complexity 15, cognitive-complexity 15).
# ESLint ne lit pas les .astro (aucun analyseur .astro) : seuls .ts, .mjs, .js et .vue du frontend.
# tsc lit les types de .astro/ (générés par le build, que la porte joue avant l'analyse ; à la main : npx astro sync).
# Pas de Python dans le dépôt : pas de ruff. Les scripts de la racine (scripts/*.ts, batch hebdo) ne sont pas analysés.
analyse:
  # L110 (27-11) : la porte a vu ESLint tomber sur une assertion interne de V8 (« Trace/breakpoint trap »,
  # code 133) dans le fil qui compile le code optimisé en tâche de fond (OptimizingCompileDispatcher) :
  # rapport vide, porte rouge sans aucune violation. Non reproduit en 15 passes ; ce fil est donc coupé
  # (--no-concurrent-recompilation, refusé dans NODE_OPTIONS, d'où node + eslint.js) : même rapport,
  # 23,5 s au lieu de 20,2 s.
  - name: eslint
    dir: frontend
    command: ../scripts/avec-node.sh node --no-concurrent-recompilation node_modules/eslint/bin/eslint.js -f json .
    format: eslint-json
    configs: [frontend/eslint.config.mjs]
  - name: tsc
    dir: frontend
    command: ../scripts/avec-node.sh npx tsc --noEmit --pretty false
    format: tsc
    configs: [frontend/tsconfig.json]
