# Livraison par `cadence deliver` (https://github.com/Sylad/cadence).
# Cloudflare Pages (intégration Git) construit et publie lui-même à chaque push sur main :
# rien à lancer pour déployer. Pas de CI GitHub par commit (le seul workflow,
# batch-update, est planifié le lundi). La livraison se prouve par la page d'accueil
# qui porte le sha court du commit poussé (<meta name="version">, posé au build
# depuis CF_PAGES_COMMIT_SHA — frontend/src/lib/build-version.ts).
deliver:
  ci: none
  deploy: []
  verify:
    - url: https://claude-code-codex-25m.pages.dev/
      contains: '<meta name="version" content="${SHORT}">'
  verifyTimeout: 600

# Revue UX automatique des vagues (cadence orchestrate) : le programme lance l'app depuis la racine,
# sonde l'URL puis tue le groupe. Node 22 (.nvmrc) : le Node par défaut de la machine est trop ancien pour Astro 6.
orchestrate:
  # Porte de tests de la vague (L41) : lancée par le programme après chaque étape d'écriture, depuis la racine.
  # Commandes vérifiées vertes sur main le 2026-10-25 (npm test : 124 tests node --test, 123 passés, 1 ignoré ;
  # astro build : 36 pages). Les tests e2e lisent `dist` (ignoré par git).
  # L42 (25-10) : cadence joue maintenant `build` AVANT `test`, ligne de base comprise (cadence L333) — le build
  # n'est plus répété ici ; les tests qui lisent frontend/dist le trouvent construit par la porte `build`.
  test: 'cd frontend && npm test'
  build: 'cd frontend && npx astro build'
  precheck: true
  ux:
    command: 'cd frontend && npx astro dev --port 4311 --host 127.0.0.1'
    url: http://127.0.0.1:4311
    timeout: 300

# Documentation qui suit le code (cadence docs.sync, L307 de cadence, 24-10) : raf check et la revue signalent un lot dont le code laisse sa doc en retard ; docs.articles = étude de cas du projet dans claude-code-codex (le bibliothécaire propose un lot là-bas).
docs:
  sync:
    # Structure du site (composants, layouts, lib, pages de premier niveau, config Astro) : le tableau « Pages » et la « Stack » du README, le CLAUDE.md. Exclus : les études de cas et les données (`data/`), ce sont des contenus, pas la structure.
    - paths: ['frontend/src/components/**', 'frontend/src/layouts/**', 'frontend/src/lib/**', 'frontend/src/pages/*.astro', 'frontend/astro.config.mjs', '!**/*.test.*', '!**/*.spec.*', '!**/__snapshots__/**']
      docs: [README.md, CLAUDE.md, 'docs/nouveautes/*.md']
    # Batch hebdomadaire et workflow : section « Mise à jour hebdo » du README et règles du CLAUDE.md.
    - paths: ['scripts/**', '.github/workflows/**', '!**/*.test.*']
      docs: [README.md, CLAUDE.md]
  since: 2026-10-24
